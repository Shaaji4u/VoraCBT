name: CI Quality Gate

on:
  pull_request:
  push:
    branches: [ main, work ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, pdo_mysql, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP lint
        run: find app routes public resources tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JS syntax checks
        run: |
          node --check public/js/pages/admin-dashboard.js
          node --check public/js/pages/student-dashboard.js
          node --check public/js/pages/exam.js
          node --check public/js/components/Proctoring.js

      - name: PHPUnit
        run: vendor/bin/phpunit
