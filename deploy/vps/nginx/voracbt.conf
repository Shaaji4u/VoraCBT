server {
    listen 80;
    server_name cbt.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cbt.example.com;

    root /var/www/voracbt/current/public;
    index index.php;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/cbt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|composer\.(json|lock)|package\.json) {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(jpg|jpeg|png|gif|css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }
}
